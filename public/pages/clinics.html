<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unidades de Saúde Próximas · e-Immune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/variables.css" />
<link rel="stylesheet" href="../assets/css/reset.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/responsive.css" />
<link rel="stylesheet" href="../assets/css/list.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="../assets/css/clinics.css" />
</head>
<body>
  <div class="app-shell app-shell--app">
    <header class="topbar">
      <a class="icon-btn" href="home.html" aria-label="Voltar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1 class="topbar__title">Unidades de Saúde Próximas</h1>
      <button class="icon-btn icon-btn--primary" id="btn-info" aria-label="Sobre as unidades" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
      </button>
    </header>

    <main class="screen screen--padded" style="padding-top:8px;">
      <div class="clinic-search">
        <label class="input-wrapper clinic-search__input" for="clinic-query">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="clinic-query" placeholder="Buscar endereço ou unidade" autocomplete="off" />
        </label>
        <button class="clinic-search__filters" id="btn-filters" type="button" aria-expanded="false" aria-controls="clinic-filters">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Filtros
        </button>
      </div>

      <div class="filter-panel" id="clinic-filters" hidden>
        <label class="filter-panel__label" for="clinic-radius">Distância máxima</label>
        <select id="clinic-radius" class="filter-panel__select">
          <option value="5">Até 5 km</option>
          <option value="10" selected>Até 10 km</option>
          <option value="25">Até 25 km</option>
          <option value="50">Até 50 km</option>
        </select>
      </div>

      <p class="clinic-notice" id="clinic-notice" hidden></p>

      <div class="clinic-map-wrap">
        <div id="clinic-map" class="clinic-map" role="region" aria-label="Mapa das unidades de saúde"></div>
        <button class="clinic-map__locate" id="btn-locate" type="button" aria-label="Usar minha localização">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
      </div>

      <section class="card clinic-list-card">
        <div class="clinic-list-card__header">
          <h2 class="clinic-list-card__title">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2a7 7 0 00-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>
            Unidades próximas a você
          </h2>
          <label class="sr-only" for="clinic-sort">Ordenar</label>
          <select id="clinic-sort" class="clinic-sort">
            <option value="distance">Ordenar por distância</option>
            <option value="name">Ordenar por nome</option>
          </select>
        </div>

        <div id="clinic-skeleton">
          <div class="skeleton" style="height:84px; margin-bottom:12px;"></div>
          <div class="skeleton" style="height:84px;"></div>
        </div>
        <div id="clinic-list" hidden></div>
        <div id="clinic-empty" class="empty-state" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <p class="empty-state__title">Nenhuma unidade encontrada</p>
          <p id="clinic-empty-text">Tente aumentar a distância máxima em Filtros.</p>
        </div>
      </section>

      <a class="btn btn-primary clinic-routes" id="btn-routes" href="#" target="_blank" rel="noopener" aria-disabled="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l10 10-10 10L2 12z"/><path d="M9 13v-2h5l-2-2M14 11l-2 2"/></svg>
        Ver rotas no mapa
      </a>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <div class="nav-brand">
        <div class="brand-shield brand-shield--nav"><img src="../assets/img/logo.svg" alt="" aria-hidden="true" onerror="this.style.display='none'" /></div>
        <span class="nav-brand__title">e-Immune</span>
      </div>
      <a class="bottom-nav__item" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home
      </a>
      <a class="bottom-nav__item" href="vaccine-record-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6l1 2h3a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h3z"/><path d="M9 12h6M9 16h6"/></svg>Histórico
      </a>
      <a class="bottom-nav__item" href="vaccine-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2l4 4-9 9-5 1 1-5z"/></svg>Vacinas
      </a>
      <a class="bottom-nav__item is-active" href="clinics.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Clínicas
      </a>
      <a class="bottom-nav__item" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Perfil
      </a>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/clinics.js"></script>
</body>
</html>
