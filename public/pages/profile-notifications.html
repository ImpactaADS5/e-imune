<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preferências de Notificações · e-Immune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/variables.css" />
<link rel="stylesheet" href="../assets/css/reset.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/responsive.css" />
<link rel="stylesheet" href="../assets/css/profile.css" />
</head>
<body>
  <div class="app-shell app-shell--app">
    <header class="topbar">
      <a class="icon-btn" href="profile.html" aria-label="Voltar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1 class="topbar__title">Preferências de Notificações</h1>
      <span style="width:36px;" aria-hidden="true"></span>
    </header>

    <main class="screen screen--padded" style="padding-top:8px;">
      <div class="menu-list" id="prefs-list">
        <div class="setting-row">
          <label class="setting-row__body" for="pref-proximasDoses">
            <span class="setting-row__title">Próximas doses</span>
            <span class="setting-row__desc">Receber lembretes das próximas doses</span>
          </label>
          <span class="switch">
            <input type="checkbox" id="pref-proximasDoses" data-pref="proximasDoses" role="switch" disabled />
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </div>
        <div class="setting-row">
          <label class="setting-row__body" for="pref-campanhas">
            <span class="setting-row__title">Campanhas</span>
            <span class="setting-row__desc">Receber comunicados de campanhas de vacinação</span>
          </label>
          <span class="switch">
            <input type="checkbox" id="pref-campanhas" data-pref="campanhas" role="switch" disabled />
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </div>
        <div class="setting-row">
          <label class="setting-row__body" for="pref-alertas">
            <span class="setting-row__title">Alertas importantes</span>
            <span class="setting-row__desc">Informações importantes sobre vacinas e saúde</span>
          </label>
          <span class="switch">
            <input type="checkbox" id="pref-alertas" data-pref="alertas" role="switch" disabled />
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </div>
        <div class="setting-row">
          <label class="setting-row__body" for="pref-dicas">
            <span class="setting-row__title">Dicas de saúde</span>
            <span class="setting-row__desc">Conteúdos e orientações de saúde</span>
          </label>
          <span class="switch">
            <input type="checkbox" id="pref-dicas" data-pref="dicas" role="switch" disabled />
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </div>
        <div class="setting-row">
          <label class="setting-row__body" for="pref-resumoSemanal">
            <span class="setting-row__title">Resumo semanal</span>
            <span class="setting-row__desc">Resumo das suas vacinas toda semana</span>
          </label>
          <span class="switch">
            <input type="checkbox" id="pref-resumoSemanal" data-pref="resumoSemanal" role="switch" disabled />
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </div>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <div class="nav-brand">
        <div class="brand-shield brand-shield--nav"><img src="../assets/img/logo.svg" alt="" aria-hidden="true" onerror="this.style.display='none'" /></div>
        <span class="nav-brand__title">e-Immune</span>
      </div>
      <a class="bottom-nav__item" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home
      </a>
      <a class="bottom-nav__item" href="vaccine-record-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6l1 2h3a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h3z"/><path d="M9 12h6M9 16h6"/></svg>Histórico
      </a>
      <a class="bottom-nav__item" href="vaccine-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2l4 4-9 9-5 1 1-5z"/></svg>Vacinas
      </a>
      <a class="bottom-nav__item" href="clinics.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Clínicas
      </a>
      <a class="bottom-nav__item is-active" href="profile.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Perfil
      </a>
    </nav>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/profile.js"></script>
</body>
</html>
