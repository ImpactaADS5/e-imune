<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar · e-Immune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/variables.css" />
<link rel="stylesheet" href="../assets/css/reset.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/responsive.css" />
<link rel="stylesheet" href="../assets/css/auth.css" />
</head>
<body>
  <div class="app-shell app-shell--auth">
    <main class="screen auth-screen">
      <button class="icon-btn" style="margin:16px 0 0 12px;" onclick="history.back()" aria-label="Voltar" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <div class="auth-content">
        <div class="text-center" style="margin-bottom: 22px;">
          <div class="brand-shield" style="margin:0 auto;">
            <img src="../assets/img/logo.svg" alt="" aria-hidden="true" onerror="this.style.display='none'" />
          </div>
          <h1 class="brand-title" style="margin-top:14px;">e-Immune</h1>
        </div>

        <h2 class="text-center" style="font-size:22px;">Bem-vindo(a)!</h2>
        <p class="text-muted text-center" style="margin-top:4px; margin-bottom:26px;">Faça login para continuar</p>

        <form id="login-form" novalidate>
          <div class="input-group" id="group-email">
            <label for="email">E-mail</label>
            <div class="input-wrapper">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z" stroke="none"/><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
              <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="username" required />
            </div>
            <span class="field-error"></span>
          </div>

          <div class="input-group" id="group-senha">
            <label for="senha">Senha</label>
            <div class="input-wrapper">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required />
              <span class="toggle-visibility" id="toggle-senha" role="button" aria-label="Mostrar senha" tabindex="0">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </span>
            </div>
            <span class="field-error"></span>
          </div>

          <div class="text-right" style="text-align:right; margin-bottom:22px;">
            <a href="#" class="link" style="font-size:13.5px;">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="btn btn-primary" id="btn-login">Entrar</button>

          <p class="form-footnote text-muted">
            Não tem uma conta? <a href="register.html" class="link">Cadastre-se</a>
          </p>
        </form>
      </div>

      <div class="wave-bg" aria-hidden="true"></div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
