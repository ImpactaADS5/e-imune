<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>e-Immune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/variables.css" />
<link rel="stylesheet" href="../assets/css/reset.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/responsive.css" />
<link rel="stylesheet" href="../assets/css/splash.css" />
<link rel="stylesheet" href="/assets/css/arquivo.css">
<script src="/assets/js/arquivo.js"></script>
</head>
<body>
  <div class="app-shell app-shell--auth">
    <main class="screen splash">
      <div class="splash__center">
        <div class="brand-shield brand-shield--lg">
          <img src="../assets/img/logo.svg" alt="" aria-hidden="true" onerror="this.style.display='none'" />
        </div>
        <h1 class="brand-title" style="margin-top:20px;">e-Immune</h1>
        <div class="splash__divider"></div>
        <p class="text-muted text-center" style="max-width:260px; margin-top:6px;">
          Sistema Digital de Controle de Vacinação
        </p>
      </div>

      <div class="splash__loading">
        <div class="dots" role="status" aria-label="Carregando">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="wave-bg" aria-hidden="true"></div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/splash.js"></script>
</body>
</html>
