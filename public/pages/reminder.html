<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lembrete · e-Immune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/variables.css" />
<link rel="stylesheet" href="../assets/css/reset.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/responsive.css" />
<link rel="stylesheet" href="../assets/css/reminder.css" />
</head>
<body>
  <div class="app-shell app-shell--app">
    <header class="topbar">
      <a class="icon-btn" href="next-doses.html" aria-label="Voltar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1 class="topbar__title">Lembrete</h1>
      <a class="icon-btn icon-btn--primary" id="btn-edit-record" href="vaccine-record-list.html" aria-label="Editar registro da vacina">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </a>
    </header>

    <main class="screen screen--padded" style="padding-top:8px;">
      <div id="reminder-skeleton">
        <div class="skeleton" style="height:180px; margin-bottom:16px;"></div>
        <div class="skeleton" style="height:56px; margin-bottom:12px;"></div>
        <div class="skeleton" style="height:56px;"></div>
      </div>

      <div id="reminder-empty" class="empty-state" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <p class="empty-state__title" id="reminder-empty-title">Sem data de próxima dose</p>
        <p id="reminder-empty-text">Informe a data da próxima dose no registro para poder criar um lembrete.</p>
        <a class="btn btn-outline" id="reminder-empty-action" style="margin-top:20px;" href="next-doses.html">Ver próximas doses</a>
      </div>

      <div id="reminder-content" hidden>
        <section class="reminder-hero">
          <div class="reminder-hero__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8"><path class="reminder-bell-fill" d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9z"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          </div>
          <h2 class="reminder-hero__title" id="reminder-title"></h2>
          <p class="reminder-hero__label">Data da próxima dose</p>
          <p class="reminder-hero__date" id="reminder-date"></p>
        </section>

        <div class="reminder-row">
          <label class="reminder-row__label" for="reminder-active">Lembrete ativado</label>
          <span class="switch">
            <input type="checkbox" id="reminder-active" role="switch" />
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </div>

        <div class="input-group" style="margin-top:20px;">
          <label for="reminder-advance">Notificar com antecedência</label>
          <div class="input-wrapper input-wrapper--select">
            <select id="reminder-advance">
              <option value="0">No dia da dose</option>
              <option value="1">1 dia antes</option>
              <option value="2">2 dias antes</option>
              <option value="3">3 dias antes</option>
              <option value="7">7 dias antes</option>
              <option value="15">15 dias antes</option>
              <option value="30">30 dias antes</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label for="reminder-time">Horário da notificação</label>
          <div class="input-wrapper input-wrapper--select">
            <select id="reminder-time"></select>
          </div>
        </div>

        <p class="reminder-status" id="reminder-status" aria-live="polite"></p>

        <button class="btn btn-outline-danger" id="btn-delete-reminder" type="button" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
          Excluir lembrete
        </button>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <div class="nav-brand">
        <div class="brand-shield brand-shield--nav"><img src="../assets/img/logo.svg" alt="" aria-hidden="true" onerror="this.style.display='none'" /></div>
        <span class="nav-brand__title">e-Immune</span>
      </div>
      <a class="bottom-nav__item" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home
      </a>
      <a class="bottom-nav__item" href="vaccine-record-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6l1 2h3a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h3z"/><path d="M9 12h6M9 16h6"/></svg>Histórico
      </a>
      <a class="bottom-nav__item is-active" href="vaccine-list.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2l4 4-9 9-5 1 1-5z"/></svg>Vacinas
      </a>
      <a class="bottom-nav__item" href="clinics.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Clínicas
      </a>
      <a class="bottom-nav__item" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Perfil
      </a>
    </nav>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/reminder.js"></script>
</body>
</html>
