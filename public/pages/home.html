<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Início · e-Immune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/variables.css" />
<link rel="stylesheet" href="../assets/css/reset.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/responsive.css" />
<link rel="stylesheet" href="../assets/css/home.css" />
</head>
<body>
  <div class="app-shell app-shell--app">
    <main class="screen screen--padded" style="padding-top:24px;">
      <header class="home-header">
        <h1 id="greeting" class="home-greeting">Olá! 👋</h1>
        <button class="icon-btn" style="position:relative;" aria-label="Notificações" onclick="Utils.toast('Central de notificações em breve.')">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          <span id="notif-badge" class="notif-badge" hidden>0</span>
        </button>
      </header>

      <section class="card" aria-labelledby="status-title">
        <h2 id="status-title" class="card__title">Status Geral de Vacinação</h2>
        <div class="status-row">
          <div class="ring" id="status-ring" style="--pct:0;">
            <div class="ring__hole">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
            </div>
          </div>
          <div>
            <div class="status-value"><span id="status-pct">0</span>%</div>
            <div class="text-muted" style="font-size:13.5px;">Completo</div>
          </div>
        </div>
        <span class="status-tag" id="status-tag">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.9-5 4.8 1.3 6.8L12 17.7 5.9 20.8l1.3-6.8-5-4.8 6.9-.9z"/></svg>
          Calculando progresso...
        </span>
      </section>

      <section style="margin-top:22px;">
        <h2 style="font-size:16px; margin-bottom:12px;">Ações rápidas</h2>
        <div class="quick-actions">
          <a class="quick-action" href="vaccine-record-form.html">
            <span class="quick-action__icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2l4 4-9 9-5 1 1-5z"/><path d="M14 6l4 4"/></svg></span>
            <span class="quick-action__label">Registrar Nova Vacina</span>
          </a>
          <a class="quick-action" href="vaccine-record-list.html">
            <span class="quick-action__icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6l1 2h3a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h3z"/><path d="M9 12h6M9 16h6"/></svg></span>
            <span class="quick-action__label">Ver Histórico</span>
          </a>
          <a class="quick-action" href="vaccine-record-list.html?filter=upcoming">
            <span class="quick-action__icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01"/></svg></span>
            <span class="quick-action__label">Próximas Doses</span>
          </a>
          <a class="quick-action" href="#" onclick="Utils.toast('Busca de clínicas em breve.'); return false;">
            <span class="quick-action__icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
            <span class="quick-action__label">Clínicas Próximas</span>
          </a>
        </div>
      </section>

      <section id="next-dose-card" class="card card--cream" style="margin-top:22px; display:none;">
        <h2 class="card__title" style="margin-bottom:12px;">Próxima dose</h2>
        <div class="list-item" style="border:none; background:transparent; padding:0;">
          <div class="list-item__icon" style="background:#fff;color:var(--color-cream-accent);">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/></svg>
          </div>
          <div class="list-item__body">
            <div class="list-item__title" id="next-dose-name">—</div>
            <div class="list-item__meta" id="next-dose-date">—</div>
          </div>
        </div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="Utils.toast('Lembrete agendado!', 'success')">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg>
          Agendar lembrete
        </button>
      </section>

      <section class="card card--mint" style="margin-top:16px;">
        <h2 class="card__title" style="margin-bottom:8px;">Campanhas em destaque</h2>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <div>
            <strong style="color:var(--color-navy);">Campanha de Polio</strong>
            <p class="text-muted" style="font-size:13.5px; margin:4px 0 8px;">Sua dose faz a diferença!</p>
            <a href="#" class="link" style="font-size:13.5px;">Saiba mais</a>
          </div>
          <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="var(--color-primary)" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a class="bottom-nav__item is-active" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        Home
      </a>
      <a class="bottom-nav__item" href="vaccine-record-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6l1 2h3a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h3z"/><path d="M9 12h6M9 16h6"/></svg>
        Histórico
      </a>
      <a class="bottom-nav__item" href="vaccine-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2l4 4-9 9-5 1 1-5z"/></svg>
        Vacinas
      </a>
      <a class="bottom-nav__item" href="#" onclick="Utils.toast('Busca de clínicas em breve.'); return false;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        Clínicas
      </a>
      <a class="bottom-nav__item" href="#" onclick="Utils.toast('Perfil em breve.'); return false;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        Perfil
      </a>
    </nav>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/home.js"></script>
</body>
</html>
