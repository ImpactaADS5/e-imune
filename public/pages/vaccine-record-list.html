<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Histórico de Vacinas · e-Immune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/variables.css" />
<link rel="stylesheet" href="../assets/css/reset.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/responsive.css" />
<link rel="stylesheet" href="../assets/css/list.css" />
</head>
<body>
  <div class="app-shell app-shell--app">
    <header class="topbar">
      <button class="icon-btn" onclick="window.location.href='home.html'" aria-label="Voltar" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="topbar__title">Histórico de Vacinas</h1>
      <span style="width:36px;"></span>
    </header>

    <main class="screen screen--padded" style="padding-top:8px;">
      <div class="list-filters">
        <button class="filter-chip is-active" data-filter="all" type="button">Todas</button>
        <button class="filter-chip" data-filter="past" type="button">Aplicadas</button>
        <button class="filter-chip" data-filter="upcoming" type="button">Próximas</button>
      </div>

      <div id="record-skeleton">
        <div class="skeleton" style="height:76px; margin-bottom:12px;"></div>
        <div class="skeleton" style="height:76px; margin-bottom:12px;"></div>
        <div class="skeleton" style="height:76px;"></div>
      </div>

      <div id="record-list" hidden></div>

      <div id="record-empty" class="empty-state" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4h6l1 2h3a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h3z"/><path d="M9 12h6M9 16h6"/></svg>
        <p class="empty-state__title">Nenhum registro ainda</p>
        <p>Registre sua primeira vacina para começar seu histórico.</p>
      </div>
    </main>

    <button class="btn-fab fab-add" onclick="window.location.href='vaccine-record-form.html'" aria-label="Registrar nova vacina" type="button">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a class="bottom-nav__item" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home
      </a>
      <a class="bottom-nav__item is-active" href="vaccine-record-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6l1 2h3a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h3z"/><path d="M9 12h6M9 16h6"/></svg>Histórico
      </a>
      <a class="bottom-nav__item" href="vaccine-list.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2l4 4-9 9-5 1 1-5z"/></svg>Vacinas
      </a>
      <a class="bottom-nav__item" href="#" onclick="Utils.toast('Busca de clínicas em breve.'); return false;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Clínicas
      </a>
      <a class="bottom-nav__item" href="#" onclick="Utils.toast('Perfil em breve.'); return false;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Perfil
      </a>
    </nav>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/vaccine-record.js"></script>
</body>
</html>
