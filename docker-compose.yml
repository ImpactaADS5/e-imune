services:
  postgres:
    image: postgres:16
    container_name: eimune-postgres
    restart: always
    environment:
      POSTGRES_USER: eimune
      POSTGRES_PASSWORD: eimune
      POSTGRES_DB: eimune_db
    ports:
      - "5432:5432"
    volumes:
      - eimune_pgdata:/var/lib/postgresql/data
volumes:
  eimune_pgdata: